SEED: 0
EXPERIMENT: 'default_experiment'
TRAIN:
    batch_size: 128
    epochs: 150
    num_workers: 0
    input_track_size: 8
    output_track_size: 12
    lr: 0.0005 # search range: 0.01 ~ 0.0001 [0.0001, 0.0005, 0.001, 0.005, 0.01]
    lr_decay: 1 # search range: 0.1 ~ 2 [0.1,  0.5, 1,  1.5, 2]
    lr_drop: true
    aux_weight: 0.2
    val_frequency: 5
    optimizer: "adam"
    max_grad_norm: 1.0
DATA:
    train_datasets:
        - SDD
    chunk_size: 4
MODEL:
    token_num: 81 # Traj (1) + 2d/3d BB (2) + 3d P (39) + 2d P(39)
    num_layers_local: 6 # search range:  [4, 6]
    num_layers_global: 4  # search range: [4, 6]
    num_layers_ego: 4 # search range: [4, 6]
    num_layers_goal: 4
    dropout: 0.1 # search range: [0.1, 0.2, 0.3]
    num_heads: 4
    dim_hidden: 128
    dim_feedforward: 512
    type: "transmotion"
    social_grid_type: "none"
    eval_single: false
    checkpoint: "" # from scratch
    output_scale: 1
    dev: false
